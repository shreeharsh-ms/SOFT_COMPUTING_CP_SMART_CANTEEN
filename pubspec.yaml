publish_to: "none"
version: 3.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  web_socket_channel: ^3.0.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  intl: ">=0.19.0 <=0.20.2"
  qr_flutter: ^4.1.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
